<body>
<div class="app">
<aside class="panel side" id="side">
<div class="brand">
<div class="logo">FS</div>
<div>
<h1 id="brandName">FriendSpace</h1>
<small>Meet, chat, belong</small>
</div>
</div>
<div class="me-card" id="meCard">
</div>
<div class="label">Public rooms</div>
<div class="nav" id="roomNav">
</div>
<div class="label">Direct messages</div>
<div class="nav" id="dmNav">
</div>
<div class="footer">
<button class="btn soft" id="notificationsBtn">🔔 Notifications <span id="notifCount">
</span>
</button>
<button class="btn soft" id="profileBtn">👤 Edit profile</button>
<button class="btn primary" id="adminBtn">⚙️ Admin controls</button>
</div>
</aside>
<main class="panel chat">
<header class="header">
<div class="headinfo">
<button class="iconbtn mobileonly" id="menuBtn">☰</button>
<div class="headicon" id="headIcon">#</div>
<div class="grow">
<h2 id="headTitle">General</h2>
<p id="headSub">Community conversation</p>
</div>
</div>
<div class="actions">
<span class="pill" id="cloudPill">Local mode</span>
<button class="iconbtn" id="reportBtn" title="Report">⚑</button>
</div>
</header>
<div class="notice" id="notice">
</div>
<div class="messages" id="messages">
</div>
<div class="typing" id="typing">
</div>
<div class="composer">
<textarea id="composer" placeholder="Write a message...">
</textarea>
<button class="send" id="sendBtn">➤</button>
</div>
</main>
<aside class="panel right">
<div class="righthead">
<h3>Community</h3>
<div class="tabs">
<button class="active" data-people-tab="people">People</button>
<button data-people-tab="friends">Friends</button>
<button data-people-tab="bots">AI bots</button>
</div>
<input class="search" id="peopleSearch" placeholder="Search people and bots">
</div>
<div class="people" id="peopleList">
</div>
</aside>
</div>
<div class="modalback" id="genericModal">
<div class="modal" id="genericBox">
</div>
</div>
<div class="modalback" id="adminModal">
<div class="modal wide">
<div class="toolbar">
<div>
<h3>FriendSpace administration</h3>
<p>Manage the community, AI bots, rooms, moderation, and cloud sync.</p>
</div>
<button class="btn soft" data-close>Close</button>
</div>
<div class="adminlayout">
<div class="admintabs" id="adminTabs">
</div>
<div id="adminPanes">
</div>
</div>
</div>
</div>
<div class="toast" id="toast">
</div>
<script>
'use strict';

const DEFAULT={version:4,settings:{siteName:'FriendSpace',notice:'Be kind, protect your privacy, and report unsafe behavior.',aiFunctionName:'friendspace-ai',adminPin:'2468',botResponseChance:72},rooms:[{id:'general',name:'General',icon:'💬',description:'Everyday conversation'},{id:'gaming',name:'Gaming',icon:'🎮',description:'Games and teammates'},{id:'music',name:'Music',icon:'🎵',description:'Songs, artists, and playlists'},{id:'support',name:'Support',icon:'🌿',description:'Kind and supportive conversation'}],users:[{id:'u_alex',name:'Alex',bio:'Gaming, hiking, and bad jokes',interests:'gaming, hiking',avatar:'',online:true,role:'user',banned:false},{id:'u_jordan',name:'Jordan',bio:'Music lover and night owl',interests:'music, movies',avatar:'',online:false,role:'user',banned:false},{id:'u_sam',name:'Sam',bio:'Always looking for new friends',interests:'art, travel',avatar:'',online:true,role:'moderator',banned:false}],bots:[{id:'b_maya',name:'Maya',status:'Friendly community guide',personality:'Warm, curious, upbeat, and natural. Loves music and meeting new people. Avoid repetitive greetings. Remembers recent context and asks thoughtful follow-up questions.',avatar:'',rooms:['general','music'],enabled:true,aiEnabled:true,responseChance:72,minDelay:900,maxDelay:2500},{id:'b_leo',name:'Leo',status:'Gaming buddy',personality:'Relaxed, funny, knowledgeable about games, and conversational. Uses light humor but never forces jokes. Gives concise, relevant replies.',avatar:'',rooms:['gaming','general'],enabled:true,aiEnabled:true,responseChance:58,minDelay:1000,maxDelay:2800},{id:'b_ivy',name:'Ivy',status:'Supportive listener',personality:'Calm, empathetic, validating, and realistic. Does not diagnose. Encourages healthy support and asks gentle questions.',avatar:'',rooms:['support'],enabled:true,aiEnabled:true,responseChance:90,minDelay:1200,maxDelay:3000}],roomMessages:{general:[{id:'m1',senderType:'bot',senderId:'b_maya',text:'Hey everyone — what has been the best part of your day so far?',createdAt:now()}],gaming:[],music:[],support:[]},dmThreads:{},friendRequests:[],friends:[],notifications:[],reports:[],bans:[],logs:[],typing:{}};
let state=loadState(),client=null,channel=null,saveTimer=null,current={type:'room',id:'general'},peopleTab='people',adminUnlocked=false,botBusy=new Set();
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{const s=JSON.parse(localStorage.getItem('fs_social_state'));return normalize(s||clone(DEFAULT))}catch{return normalize(clone(DEFAULT))}}
function normalize(s){for(const k of Object.keys(DEFAULT))if(s[k]===undefined)s[k]=clone(DEFAULT[k]);s.settings={...DEFAULT.settings,...(s.settings||{})};s.rooms=s.rooms||[];s.users=s.users||[];s.bots=s.bots||[];s.roomMessages=s.roomMessages||{};s.dmThreads=s.dmThreads||{};s.friendRequests=s.friendRequests||[];s.friends=s.friends||[];s.notifications=s.notifications||[];s.reports=s.reports||[];s.bans=s.bans||[];s.logs=s.logs||[];return s}
let localUserId=localStorage.getItem('fs_user_id');
if(!localUserId){localUserId=uid('u');localStorage.setItem('fs_user_id',localUserId)}if(!state.users.some(u=>u.id===localUserId))state.users.push({id:localUserId,name:'Guest '+localUserId.slice(-4),bio:'New to FriendSpace',interests:'meeting friends',avatar:'',online:true,role:'admin',banned:false,createdAt:now()});
function ensureLocalUser(seed){if(!state.users.some(u=>u.id===localUserId)){state.users.push(seed||{id:localUserId,name:'Guest '+localUserId.slice(-4),bio:'New to FriendSpace',interests:'meeting friends',avatar:'',online:true,role:'user',banned:false,createdAt:now()})}return state.users.find(u=>u.id===localUserId)}
const me=()=>state.users.find(u=>u.id===localUserId),user=id=>state.users.find(u=>u.id===id),bot=id=>state.bots.find(b=>b.id===id),room=id=>state.rooms.find(r=>r.id===id),avatarHtml=(x,cls='avatar')=>`<div class="${cls} ${x.online?'online':''}">${x.avatar?`<img src="${esc(x.avatar)}">`:esc(initials(x.name))}</div>`;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}

function mutate(action,details){log(action,details);

renderAll()}
function unreadDmCount(targetId){const key=threadKey(localUserId,targetId);return(state.dmThreads[key]||[]).filter(m=>m.senderId===targetId&&!m.readBy?.includes(localUserId)).length}

function renderAll(){document.documentElement.style.setProperty('--primary',state.settings.primary||'#6757ed');
$('#brandName').textContent=state.settings.siteName;
$('#notice').textContent=state.settings.notice;renderMe();
renderNav();
renderHeader();
renderMessages();
renderPeople();
$('#notifCount').textContent=notifCount()?`(${notifCount()})`:''}
function renderMe(){const m=me();
$('#meCard').innerHTML=`${avatarHtml(m)}<div class="grow"><strong>${esc(m.name)} ${m.role!=='user'?`<span class="bottag">${esc(m.role)}</span>`:''}</strong><span>${esc(m.bio||m.interests||'')}</span></div>`}

const mentioned=state.bots.filter(b=>b.enabled&&b.aiEnabled&&b.rooms?.includes(current.id)&&lower.includes('@'+b.name.toLowerCase()));
if(mentioned.length)return mentioned.slice(0,1);return state.bots.filter(b=>b.enabled&&b.aiEnabled&&b.rooms?.includes(current.id)&&Math.random()*100<Number(b.responseChance??state.settings.botResponseChance)).sort(()=>Math.random()-.5).slice(0,1)}
function routeRoomBot(text){const chosen=eligibleRoomBots(text);
if(chosen[0])requestBotReply(chosen[0],text,'room',current.id)}
async function requestBotReply(b,newest,contextType,contextId){if(botBusy.has(b.id)||!b.enabled||!b.aiEnabled)return;botBusy.add(b.id);
const typingKey=contextType+':'+contextId;state.typing[typingKey]=b.name;renderTyping();
const delay=Math.max(500,Math.min(6000,Number(b.minDelay||900)+Math.random()*Math.max(0,Number(b.maxDelay||2200)-Number(b.minDelay||900))));await new Promise(r=>setTimeout(r,delay));try{if(!client)throw new Error('Connect Supabase cloud sync to use AI bots.');
const messages=contextType==='room'?(state.roomMessages[contextId]||[]):(state.dmThreads[threadKey(localUserId,contextId)]||[]);
const history=messages.slice(-16).map(m=>({name:senderOf(m).name,text:m.text,role:m.senderType}));
const r=contextType==='room'?room(contextId):{name:'Private chat',description:`Private conversation with ${b.name}`};
const {data,error}=await client.functions.invoke(state.settings.aiFunctionName||'friendspace-ai',{body:{message:newest,history,bot:b,room:r,user:me()}});
if(error)throw error;
const reply=String(data?.reply||'').trim();
if(!reply)throw new Error(data?.error||'No AI reply returned.');
const out={id:uid('m'),senderType:'bot',senderId:b.id,text:reply,createdAt:now(),readBy:[]};
if(contextType==='room'){state.roomMessages[contextId]=state.roomMessages[contextId]||[];state.roomMessages[contextId].push(out)}else{const key=threadKey(localUserId,contextId);state.dmThreads[key]=state.dmThreads[key]||[];state.dmThreads[key].push(out)}log('AI bot replied',`${b.name}: ${reply.slice(0,120)}`);
save()}catch(e){console.error(e);toast('AI reply failed: '+(e.message||e))}finally{delete state.typing[typingKey];botBusy.delete(b.id);
renderAll();
save()}}
function isFriend(id){return state.friends.some(f=>f.users.includes(localUserId)&&f.users.includes(id))}
function pendingWith(id){return state.friendRequests.find(r=>r.status==='pending'&&((r.fromId===localUserId&&r.toId===id)||(r.toId===localUserId&&r.fromId===id)))}
function sendFriendRequest(id){if(isFriend(id)||pendingWith(id))return toast('A friendship or request already exists.');state.friendRequests.push({id:uid('fr'),fromId:localUserId,toId:id,status:'pending',createdAt:now()});state.notifications.unshift({id:uid('n'),userId:id,type:'friend',fromId:localUserId,text:`${me().name} sent you a friend request`,read:false,createdAt:now()});mutate('Friend request sent','To '+user(id)?.name)}
function acceptRequest(id){const r=state.friendRequests.find(x=>x.id===id);
if(!r)return;r.status='accepted';state.friends.push({id:uid('f'),users:[r.fromId,r.toId],createdAt:now()});state.notifications.unshift({id:uid('n'),userId:r.fromId,type:'friend',fromId:localUserId,text:`${me().name} accepted your friend request`,read:false,createdAt:now()});mutate('Friend request accepted',user(r.fromId)?.name)}
function removeFriend(id){state.friends=state.friends.filter(f=>!(f.users.includes(localUserId)&&f.users.includes(id)));mutate('Friend removed',user(id)?.name)}
function renderPeople(){const q=$('#peopleSearch').value.toLowerCase();
let list=[];
if(peopleTab==='bots')list=state.bots.filter(b=>b.enabled);else if(peopleTab==='friends')list=state.users.filter(u=>u.id!==localUserId&&isFriend(u.id));else list=state.users.filter(u=>u.id!==localUserId&&!u.banned);list=list.filter(x=>(x.name+' '+(x.bio||x.status||'')).toLowerCase().includes(q));
$('#peopleList').innerHTML=list.length?list.map(x=>{const isB=!!bot(x.id);return`<div class="person">${avatarHtml(x,'avatar mini')}<div class="grow"><strong>${esc(x.name)} ${isB?'<span class="bottag">AI</span>':''}</strong><span>${esc(x.bio||x.status||'')}</span></div><button class="tiny" data-open-dm="${x.id}" title="Message">💬</button>${!isB&&!isFriend(x.id)?`<button class="tiny" data-add="${x.id}" title="Add friend">＋</button>`:''}${!isB&&isFriend(x.id)?`<button class="tiny" data-remove="${x.id}" title="Remove friend">✓</button>`:''}</div>`}).join(''):'<div class="empty">Nothing found.</div>';$$('[data-open-dm]').forEach(b=>b.onclick=()=>openDm(b.dataset.openDm));$$('[data-add]').forEach(b=>b.onclick=()=>sendFriendRequest(b.dataset.add));$$('[data-remove]').forEach(b=>b.onclick=()=>removeFriend(b.dataset.remove))}
function showModal(title,body,onSave,wide=false){const box=$('#genericBox');box.className='modal'+(wide?' wide':'');box.innerHTML=`<h3>${esc(title)}</h3>${body}<div class="modalactions"><button class="btn soft" data-close>Cancel</button>${onSave?'<button class="btn primary" id="modalSave">Save</button>':''}</div>`;
$('#genericModal').classList.add('show');box.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModals);
if(onSave)$('#modalSave').onclick=async()=>{try{await onSave();closeModals()}catch(e){toast(e.message||e)}}}
function closeModals(){$$('.modalback').forEach(x=>x.classList.remove('show'))}
function readFile(inp){return new Promise((res,rej)=>{const f=inp.files?.[0];
if(!f)return res('');
if(f.size>2_000_000)return rej(new Error('Choose an image smaller than 2 MB.'));
const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read image.'));r.readAsDataURL(f)})}
function editProfile(){const m=me();showModal('Edit your profile',`<p>Your profile is shared across connected devices.</p><div class="form"><div class="field"><label>Display name</label><input id="pName" value="${esc(m.name)}"></div><div class="field"><label>Bio</label><textarea id="pBio">${esc(m.bio||'')}</textarea></div><div class="field"><label>Interests</label><input id="pInterests" value="${esc(m.interests||'')}"></div><div class="field"><label>Profile picture file</label><input id="pPic" type="file" accept="image/*"></div></div>`,async()=>{const pic=await readFile($('#pPic'));m.name=$('#pName').value.trim()||m.name;m.bio=$('#pBio').value.trim();m.interests=$('#pInterests').value.trim();
if(pic)m.avatar=pic;mutate('Profile updated',m.name)})}
function showNotifications(){const mine=state.notifications.filter(n=>n.userId===localUserId);mine.forEach(n=>n.read=true);
save();showModal('Notifications',mine.length?`<div class="loglist">${mine.map(n=>{const req=state.friendRequests.find(r=>r.fromId===n.fromId&&r.toId===localUserId&&r.status==='pending');return`<div class="logitem"><strong>${esc(n.text)}</strong><span>${new Date(n.createdAt).toLocaleString()}</span>${req?`<div style="margin-top:7px"><button class="btn primary" data-accept="${req.id}">Accept</button></div>`:''}</div>`}).join('')}</div>`:'<div class="empty">No notifications.</div>',null);$$('[data-accept]').forEach(b=>b.onclick=()=>{acceptRequest(b.dataset.accept);closeModals()})}
function reportCurrent(){if(current.type!=='dm'||bot(current.id))return;showModal('Report '+targetData(current.id)?.name,`<p>Reports are visible to moderators and administrators.</p><div class="form"><div class="field"><label>Reason</label><select id="repReason"><option>Harassment</option><option>Spam</option><option>Unsafe behavior</option><option>Impersonation</option><option>Other</option></select></div><div class="field"><label>Details</label><textarea id="repDetails"></textarea></div></div>`,()=>{state.reports.unshift({id:uid('rep'),reporterId:localUserId,targetId:current.id,reason:$('#repReason').value,details:$('#repDetails').value,status:'open',createdAt:now()});mutate('User reported',targetData(current.id)?.name)})}
function adminLogin(){if(adminUnlocked)return openAdmin();showModal('Admin access',`<p>Enter the administrator PIN. The default is 2468.</p><div class="field"><label>Admin PIN</label><input id="pin" type="password"></div>`,()=>{if($('#pin').value!==state.settings.adminPin)throw new Error('Incorrect admin PIN.');adminUnlocked=true;openAdmin()})}
const adminSections=['Overview','Users','AI Bots','Rooms','Moderation','Logs','Cloud'];
function openAdmin(){closeModals();
$('#adminTabs').innerHTML=adminSections.map((x,i)=>`<button class="admintab ${i===0?'active':''}" data-atab="${x}">${x}</button>`).join('');
$('#adminPanes').innerHTML=adminSections.map((x,i)=>`<section class="pane ${i===0?'active':''}" data-pane="${x}">${adminPane(x)}</section>`).join('');
$('#adminModal').classList.add('show');$$('[data-atab]').forEach(b=>b.onclick=()=>{$$('.admintab').forEach(x=>x.classList.toggle('active',x===b));$$('.pane').forEach(x=>x.classList.toggle('active',x.dataset.pane===b.dataset.atab));
if(['Users','AI Bots','Rooms','Moderation','Logs','Cloud'].includes(b.dataset.atab))refreshAdminPane(b.dataset.atab)});bindAdmin();refreshAdminPane('Overview')}
function adminPane(x){return`<div id="pane${x.replace(/\s/g,'')}"></div>`}
function refreshAdminPane(x){const el=$('#pane'+x.replace(/\s/g,''));
if(!el)return;
if(x==='Overview')el.innerHTML=`<div class="grid2"><div class="logitem"><strong>${state.users.length}</strong> user profiles</div><div class="logitem"><strong>${state.bots.length}</strong> AI bots</div><div class="logitem"><strong>${state.rooms.length}</strong> public rooms</div><div class="logitem"><strong>${state.reports.filter(r=>r.status==='open').length}</strong> open reports</div></div><div class="help" style="margin-top:10px">This build separates public rooms, direct messages, human accounts, AI bots, friend requests, notifications, reports, bans, and logs. For a large public launch, migrate from the shared JSON record to separate Supabase tables with Auth and strict RLS.</div>`;
if(x==='Users')el.innerHTML=`<div class="tablewrap"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td><span class="chip ${u.banned?'off':''}">${u.banned?'Banned':'Active'}</span></td><td><button class="btn soft" data-useredit="${u.id}">Edit</button> <button class="btn ${u.banned?'primary':'danger'}" data-ban="${u.id}">${u.banned?'Unban':'Ban'}</button></td></tr>`).join('')}</tbody></table></div>`;
if(x==='AI Bots')el.innerHTML=`<div class="toolbar"><strong>AI personalities</strong><button class="btn primary" id="addBot">Add bot</button></div><div class="tablewrap"><table><thead><tr><th>Bot</th><th>Rooms</th><th>AI</th><th>Chance</th><th>Actions</th></tr></thead><tbody>${state.bots.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc((b.rooms||[]).map(id=>room(id)?.name||id).join(', '))}</td><td>${b.aiEnabled?'On':'Off'}</td><td>${b.responseChance}%</td><td><button class="btn soft" data-botedit="${b.id}">Edit</button> <button class="btn danger" data-botdel="${b.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`;
if(x==='Rooms')el.innerHTML=`<div class="toolbar"><strong>Public rooms</strong><button class="btn primary" id="addRoom">Add room</button></div><div class="tablewrap"><table><thead><tr><th>Icon</th><th>Name</th><th>Description</th><th>Actions</th></tr></thead><tbody>${state.rooms.map(r=>`<tr><td>${r.icon}</td><td>${esc(r.name)}</td><td>${esc(r.description)}</td><td><button class="btn soft" data-roomedit="${r.id}">Edit</button> <button class="btn danger" data-roomdel="${r.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`;
if(x==='Moderation')el.innerHTML=`<h4>Reports</h4>${state.reports.length?`<div class="tablewrap"><table><thead><tr><th>Reporter</th><th>Target</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.reports.map(r=>`<tr><td>${esc(user(r.reporterId)?.name||'Unknown')}</td><td>${esc(user(r.targetId)?.name||'Unknown')}</td><td>${esc(r.reason)}</td><td>${esc(r.status)}</td><td><button class="btn soft" data-resolve="${r.id}">Resolve</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No reports.</div>'}`;
if(x==='Logs')el.innerHTML=`<div class="toolbar"><strong>Customer and audit log</strong><button class="btn soft" id="exportLogs">Export JSON</button></div><div class="loglist">${state.logs.map(l=>`<div class="logitem"><strong>${esc(l.action)}</strong><span>${esc(user(l.actorId)?.name||'System')} · ${new Date(l.createdAt).toLocaleString()}</span><div>${esc(l.details||'')}</div></div>`).join('')||'<div class="empty">No log entries.</div>'}</div>`;
if(x==='Cloud'){const c=cloudCfg();el.innerHTML=`<div class="form"><div class="field"><label>Supabase Project URL</label><input id="cloudUrl" value="${esc(c.url)}" placeholder="https://your-project.supabase.co"></div><div class="field"><label>Publishable / anon key</label><input id="cloudKey" type="password" value="${esc(c.key)}"></div><div class="field"><label>AI Edge Function name</label><input id="fnName" value="${esc(state.settings.aiFunctionName||'friendspace-ai')}"></div><div><button class="btn primary" id="connectCloud">Connect and sync</button> <button class="btn soft" id="pullCloud">Pull latest</button> <button class="btn danger" id="disconnectCloud">Disconnect</button></div><div class="help" id="cloudHelp">The OpenAI key belongs in Supabase Edge Function secrets, never in this HTML.</div></div>`}bindAdminDynamic(x)}
function bindAdmin(){document.querySelectorAll('#adminModal [data-close]').forEach(b=>b.onclick=closeModals)}
function bindAdminDynamic(x){if(x==='Users'){$$('[data-useredit]').forEach(b=>b.onclick=()=>editUserAdmin(b.dataset.useredit));$$('[data-ban]').forEach(b=>b.onclick=()=>{const u=user(b.dataset.ban);u.banned=!u.banned;mutate(u.banned?'User banned':'User unbanned',u.name);refreshAdminPane('Users')})}if(x==='AI Bots'){$('#addBot').onclick=()=>editBot();$$('[data-botedit]').forEach(b=>b.onclick=()=>editBot(b.dataset.botedit));$$('[data-botdel]').forEach(b=>b.onclick=()=>{const x=bot(b.dataset.botdel);
if(confirm('Delete '+x.name+'?')){state.bots=state.bots.filter(y=>y.id!==x.id);mutate('AI bot deleted',x.name);refreshAdminPane('AI Bots')}})}if(x==='Rooms'){$('#addRoom').onclick=()=>editRoom();$$('[data-roomedit]').forEach(b=>b.onclick=()=>editRoom(b.dataset.roomedit));$$('[data-roomdel]').forEach(b=>b.onclick=()=>{const r=room(b.dataset.roomdel);
if(state.rooms.length<=1)return toast('Keep at least one room.');
if(confirm('Delete '+r.name+'?')){state.rooms=state.rooms.filter(x=>x.id!==r.id);delete state.roomMessages[r.id];state.bots.forEach(x=>x.rooms=x.rooms.filter(id=>id!==r.id));mutate('Room deleted',r.name);refreshAdminPane('Rooms')}})}if(x==='Moderation')$$('[data-resolve]').forEach(b=>b.onclick=()=>{const r=state.reports.find(x=>x.id===b.dataset.resolve);r.status='resolved';mutate('Report resolved',r.reason);refreshAdminPane('Moderation')});
if(x==='Logs'&&$('#exportLogs'))$('#exportLogs').onclick=exportLogs;
if(x==='Cloud'){if($('#connectCloud'))$('#connectCloud').onclick=connectCloud;
if($('#pullCloud'))$('#pullCloud').onclick=pullCloud;
if($('#disconnectCloud'))$('#disconnectCloud').onclick=disconnectCloud}}
function editUserAdmin(id){const u=user(id);showModal('Edit user',`<div class="form"><div class="field"><label>Name</label><input id="euName" value="${esc(u.name)}"></div><div class="field"><label>Role</label><select id="euRole"><option ${u.role==='user'?'selected':''}>user</option><option ${u.role==='moderator'?'selected':''}>moderator</option><option ${u.role==='admin'?'selected':''}>admin</option></select></div></div>`,()=>{u.name=$('#euName').value.trim()||u.name;u.role=$('#euRole').value;mutate('User updated',u.name);openAdmin();refreshAdminPane('Users')})}
function botForm(b={}){return`<div class="form"><div class="grid2"><div class="field"><label>Name</label><input id="ebName" value="${esc(b.name||'')}" ></div><div class="field"><label>Status</label><input id="ebStatus" value="${esc(b.status||'AI community member')}"></div></div><div class="field"><label>Personality instructions</label><textarea id="ebPersonality" rows="5">${esc(b.personality||'Friendly, realistic, relevant, and conversational.')}</textarea></div><div class="field"><label>Profile picture file</label><input id="ebPic" type="file" accept="image/*"></div><div class="field"><label>Rooms</label>${state.rooms.map(r=>`<label style="display:inline-block;margin-right:10px"><input type="checkbox" class="ebRoom" value="${r.id}" ${(b.rooms||[]).includes(r.id)?'checked':''}> ${esc(r.name)}</label>`).join('')}</div><div class="grid2"><div class="field"><label>Response chance %</label><input id="ebChance" type="number" min="0" max="100" value="${b.responseChance??70}"></div><div class="field"><label>AI replies</label><select id="ebAi"><option value="true" ${b.aiEnabled!==false?'selected':''}>Enabled</option><option value="false" ${b.aiEnabled===false?'selected':''}>Disabled</option></select></div></div></div>`}
function editBot(id){const b=id?bot(id):{id:uid('b'),name:'New Bot',rooms:[state.rooms[0]?.id],enabled:true,aiEnabled:true,responseChance:70,minDelay:900,maxDelay:2500};showModal(id?'Edit AI bot':'Add AI bot',botForm(b),async()=>{const pic=await readFile($('#ebPic'));b.name=$('#ebName').value.trim()||'AI Bot';b.status=$('#ebStatus').value.trim();b.personality=$('#ebPersonality').value.trim();b.rooms=$$('.ebRoom:checked').map(x=>x.value);b.responseChance=Math.max(0,Math.min(100,Number($('#ebChance').value)||0));b.aiEnabled=$('#ebAi').value==='true';
if(pic)b.avatar=pic;
if(!id)state.bots.push(b);mutate(id?'AI bot updated':'AI bot created',b.name);openAdmin();refreshAdminPane('AI Bots')})}
function editRoom(id){const r=id?room(id):{id:uid('room'),name:'New Room',icon:'💬',description:''};showModal(id?'Edit room':'Add room',`<div class="form"><div class="grid2"><div class="field"><label>Name</label><input id="erName" value="${esc(r.name)}"></div><div class="field"><label>Icon</label><input id="erIcon" value="${esc(r.icon)}"></div></div><div class="field"><label>Description</label><input id="erDesc" value="${esc(r.description)}"></div></div>`,()=>{r.name=$('#erName').value.trim()||'Room';r.icon=$('#erIcon').value.trim()||'💬';r.description=$('#erDesc').value.trim();
if(!id){state.rooms.push(r);state.roomMessages[r.id]=[]}mutate(id?'Room updated':'Room created',r.name);openAdmin();refreshAdminPane('Rooms')})}
function exportLogs(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state.logs,null,2)],{type:'application/json'}));a.download='friendspace-audit-log-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function normalizeUrl(v){let s=String(v||'').trim().replace(/\s/g,'');
if(!s)return'';
if(!/^https?:\/\//i.test(s))s='https://'+s;
const u=new URL(s);
if(!u.hostname.endsWith('.supabase.co'))throw new Error('Use your Project URL, like https://your-project.supabase.co');return u.origin}
function cloudCfg(){return{url:localStorage.getItem('fs_sb_url')||'',key:localStorage.getItem('fs_sb_key')||''}}
function setCloud(ok,text=''){const p=$('#cloudPill');p.textContent=ok?'Cloud synced':'Local mode';p.classList.toggle('on',ok);
const h=$('#cloudHelp');
if(h&&text)h.textContent=text}
async function connectCloud(){try{const localProfile=clone(me());
const url=normalizeUrl($('#cloudUrl').value),key=$('#cloudKey').value.trim();
if(!url||!key)throw new Error('Enter the Project URL and publishable key.');state.settings.aiFunctionName=$('#fnName').value.trim()||'friendspace-ai';localStorage.setItem('fs_sb_url',url);localStorage.setItem('fs_sb_key',key);client=window.supabase.createClient(url,key,{auth:{persistSession:false}});
const {data,error}=await client.from('friendspace_store').select('payload').eq('id','main').maybeSingle();
if(error)throw error;
if(data?.payload){state=normalize(data.payload);ensureLocalUser(localProfile)}else{const {error:e}=await client.from('friendspace_store').upsert({id:'main',payload:state,updated_at:now()});
if(e)throw e}subscribe();
save();setCloud(true,'Connected. AI calls use the '+state.settings.aiFunctionName+' Edge Function.');
renderAll();toast('Supabase connected')}catch(e){setCloud(false,'Connection failed: '+(e.message||e));toast(e.message||e)}}
function subscribe(){if(channel&&client)client.removeChannel(channel);channel=client.channel('fs-social-main').on('postgres_changes',{event:'*',schema:'public',table:'friendspace_store',filter:'id=eq.main'},p=>{const incoming=p.new?.payload;
if(incoming){state=normalize(incoming);
if(!state.users.some(u=>u.id===localUserId))state.users.push({id:localUserId,name:'Guest '+localUserId.slice(-4),bio:'New to FriendSpace',interests:'meeting friends',avatar:'',online:true,role:'user',banned:false});localStorage.setItem('fs_social_state',JSON.stringify(state));
renderAll()}}).subscribe()}
function scheduleCloud(){if(!client)return;clearTimeout(saveTimer);
saveTimer=setTimeout(async()=>{const {error}=await client.from('friendspace_store').upsert({id:'main',payload:state,updated_at:now()});
if(error)setCloud(false,'Cloud save failed: '+error.message);else setCloud(true)},650)}
async function pullCloud(){if(!client)return toast('Connect Supabase first.');
const {data,error}=await client.from('friendspace_store').select('payload').eq('id','main').single();
if(error)return toast(error.message);state=normalize(data.payload);ensureLocalUser();localStorage.setItem('fs_social_state',JSON.stringify(state));
renderAll();toast('Latest cloud data loaded')}
function disconnectCloud(){if(channel&&client)client.removeChannel(channel);channel=null;client=null;localStorage.removeItem('fs_sb_url');localStorage.removeItem('fs_sb_key');setCloud(false);toast('Cloud disconnected')}
async function autoConnect(){const c=cloudCfg();
if(!c.url||!c.key)return;try{client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:false}});subscribe();setCloud(true);await pullCloud()}catch{setCloud(false)}}
$('#sendBtn').onclick=sendMessage;
$('#composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#profileBtn').onclick=editProfile;
$('#notificationsBtn').onclick=showNotifications;
$('#adminBtn').onclick=adminLogin;
$('#reportBtn').onclick=reportCurrent;
$('#peopleSearch').oninput=renderPeople;$$('[data-people-tab]').forEach(b=>b.onclick=()=>{$$('[data-people-tab]').forEach(x=>x.classList.toggle('active',x===b));peopleTab=b.dataset.peopleTab;renderPeople()});
$$('[data-close]').forEach(b=>b.onclick=closeModals);$$('.modalback').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals()}));
renderAll();autoConnect();
</script>
